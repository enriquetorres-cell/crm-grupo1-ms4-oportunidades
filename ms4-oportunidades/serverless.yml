# MS4 · Oportunidades y Cotizaciones (P4). RDS PostgreSQL, base ventas_db, un schema por tenant.
service: crm-ms4-oportunidades
frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    DB_HOST: ${cf:crm-rds-${sls:stage}.DbHost}
    DB_NOMBRE: ventas_db
    DB_USUARIO: crm_admin
    DB_CLAVE: ${env:CRM_DB_PASSWORD}
    TOPICO_EVENTOS: ${cf:crm-compartido-${sls:stage}.TopicoEventosArn}
    BUCKET_DOCUMENTOS: ${self:custom.bucket}
  httpApi:
    cors: true
    authorizers:
      tokenCrm:
        type: request
        functionArn: ${self:custom.autorizadorArn}
        identitySource: $request.header.Authorization
        enableSimpleResponses: true
        payloadVersion: '2.0'
        resultTtlInSeconds: 300

custom:
  autorizadorArn: ${cf:crm-ms1-usuarios-${sls:stage}.AutorizadorArn}
  bucket: crm-documentos-${aws:accountId}-${sls:stage}
  pythonRequirements:
    dockerizePip: false

plugins:
  - serverless-python-requirements

package:
  patterns:
    - '!tests/**'
    - '!**/__pycache__/**'
    - '!node_modules/**'

functions:
  api:
    handler: src/handler.main
    events:
      - httpApi: { method: GET, path: /ms4/health }
      - httpApi: { method: GET, path: /ms4/oportunidades, authorizer: { name: tokenCrm } }
      - httpApi: { method: GET, path: '/ms4/oportunidades/{id}', authorizer: { name: tokenCrm } }
      - httpApi: { method: POST, path: /ms4/oportunidades, authorizer: { name: tokenCrm } }
      - httpApi: { method: PATCH, path: '/ms4/oportunidades/{id}/etapa', authorizer: { name: tokenCrm } }
      - httpApi: { method: POST, path: /ms4/cotizaciones, authorizer: { name: tokenCrm } }
      - httpApi: { method: PATCH, path: '/ms4/cotizaciones/{id}/estado', authorizer: { name: tokenCrm } }
      - httpApi: { method: GET, path: /ms4/pronostico, authorizer: { name: tokenCrm } }
      - httpApi: { method: GET, path: /ms4/productos, authorizer: { name: tokenCrm } }

  consumidor:
    handler: src/handler.consumidor
    events:
      - sqs:
          arn: ${cf:crm-compartido-${sls:stage}.ColaMs4Arn}
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    BucketDocumentos:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    PermisoAutorizador:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: ${self:custom.autorizadorArn}
        Principal: apigateway.amazonaws.com
        SourceArn:
          Fn::Join:
            - ''
            - - 'arn:aws:execute-api:'
              - { Ref: AWS::Region }
              - ':'
              - { Ref: AWS::AccountId }
              - ':'
              - { Ref: HttpApi }
              - '/authorizers/*'
